name: Build exact safety search
on:
  push:
    branches: [main]
    paths:
      - 'build_exact_site.py'
      - 'ohrana/data.json.gz'
      - '.github/workflows/build-exact.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact site
        run: python build_exact_site.py
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exact/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build exact occupational safety search"
            git push
          fi
