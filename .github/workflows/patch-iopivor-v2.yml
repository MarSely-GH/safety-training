name: Patch ИоПиВОР v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-iopivor-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ИоПиВОР assistant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('iopivor/index.html')
          s = p.read_text(encoding='utf-8')

          # Add the user's main real-world example to the quick examples.
          old_chip = '''        <button class="chip" data-example="На КПП приехал автобус. У водителя есть личный пропуск, но транспортного пропуска на автобус нет.">Автобус без транспортного пропуска</button>'''
          new_chip = '''        <button class="chip" data-example="Водитель отказывается предъявить или передать документы для проверки на КПП.">Водитель не показывает документы</button>\n''' + old_chip
          if 'Водитель не показывает документы</button>' not in s:
              if old_chip not in s: raise SystemExit('chip marker not found')
              s = s.replace(old_chip, new_chip, 1)

          # Add a dedicated rule for refusal to present/hand over documents.
          marker = """    {\n      id:'vehicle-ngkm', title:'Допуск транспортных средств на территорию НГКМ', priority:8,"""
          rule = """    {\n      id:'document-refusal', title:'Отказ предъявить или передать документы для проверки', priority:16,\n      keywords:['не показывает документы','не предъявляет документы','отказывается предъявить','отказывается предоставить','не дает документы','не даёт документы','не передает документы','не передаёт документы','водитель не показывает','водитель отказывается','документы для проверки','проверка документов'],\n      phrases:['водитель не хочет предоставить документы','водитель не показывает документы','отказывается предоставить документы','не хочет дать документы','не хочет предъявить документы','не передает документы для проверки'],\n      refs:['п. 3.4.2','п. 5.4 — если отказ касается документов на транспорт и перевозимые ТМЦ'],\n      verdict:'Проверка документов обязательна. Потребовать предъявить пропуск/вахтовое удостоверение в открытом виде; при необходимости — передать документ работнику охраны для проверки подлинности. Пока обязательная проверка не завершена, допуск или проезд не осуществлять.',\n      steps:[\n        'Остановить оформление допуска/проезда до завершения обязательной проверки документов.',\n        'Потребовать предъявить пропуск или вахтовое удостоверение в открытом виде для идентификации личности.',\n        'Если для проверки подлинности это необходимо — потребовать передать документ в руки работнику охраны. Инструкция прямо предусматривает такую передачу по требованию работника охраны.',\n        'Если водитель отказывается предоставить документы именно на транспортное средство и перевозимые ТМЦ, дополнительно учитывать п. 5.4: такой отказ указан среди оснований для изъятия транспортного пропуска.',\n        'При продолжающемся отказе зафиксировать обстоятельства и действовать по разделу 5 Инструкции, не придумывая мер, которых в найденных пунктах нет.'\n      ],\n      docs:['пропуск/вахтовое удостоверение','при необходимости — документ в руки для проверки подлинности','для транспорта/ТМЦ — предусмотренные документы на ТС и груз'],\n      note:'П. 3.4.2 устанавливает проверку документов при каждом посещении, предъявление пропуска/вахтового удостоверения в открытом виде и, при необходимости, передачу документов работнику охраны для проверки подлинности. П. 5.4 отдельно указывает отказ водителя предоставить документы на транспорт и перевозимые ТМЦ как основание для изъятия транспортного пропуска.'\n    },\n"""
          if "id:'document-refusal'" not in s:
              if marker not in s: raise SystemExit('rule marker not found')
              s = s.replace(marker, rule + marker, 1)

          # Correct amendment references for transport rules.
          s = s.replace("refs:['пп. 3.7.1–3.7.10','п. 3.3.4'], amended:['Изм. №2: пп. 3.7.4, 3.7.8'],",
                        "refs:['пп. 3.7.1–3.7.10','п. 3.3.4'], amended:['Изм. №2: п. 3.7.3','Изм. №3: п. 3.7.4'],")
          s = s.replace("'Если заявляется внеочередной проезд — проверить основание для специального пропуска на внеочередной проезд по новой редакции п. 3.7.4 (Изменение №2).',",
                        "'Если заявляется внеочередной проезд — проверить специальный пропуск для внеочередного проезда. Термин «для внеочередного проезда» введён Изменением №2 в п. 3.2.2 и п. 3.3.1.2.',")
          s = s.replace("note:'На странице 33 Инструкции п. 3.7.1 прямо устанавливает транспортный пропуск + путевой лист + запись в журнале. П. 3.7.2 запрещает несанкционированный провоз людей, взрывоопасных предметов и источников излучения. Изменением №2 изменены условия внеочередного проезда и редакция п. 3.7.8.'",
                        "note:'П. 3.7.1 устанавливает транспортный пропуск, путевой лист и запись в журнале. Изменение №2 изложило в новой редакции п. 3.7.3: все транспортные средства и ТМЦ при въезде/выезде подлежат осмотру, при необходимости — досмотру. Изменение №3 изложило в новой редакции п. 3.7.4 о транзитном маршруте.'")

          s = s.replace("'Учитывать Изменение №2: новая редакция п. 3.8.4 допускает внеочередной въезд определённой категории транспортных средств при наличии специального разрешения.'",
                        "'Учитывать Изменение №2: п. 3.8.4 изложен в новой редакции — все транспортные средства и ТМЦ при въезде (выезде) на охраняемые объекты подлежат осмотру, а при необходимости — досмотру по п. 3.7.3.'")
          s = s.replace("note:'П. 3.8.1 перечисляет обязательные документы, п. 3.8.2 регулирует транспорт филиала «Медико-санитарная часть», п. 3.8.4 изменён Изменением №2.'",
                        "note:'П. 3.8.1 перечисляет обязательные документы. Изменение №2 изложило п. 3.8.4 в новой редакции: все транспортные средства и ТМЦ при въезде/выезде на охраняемые объекты подлежат осмотру, при необходимости — досмотру в порядке п. 3.7.3.'")

          # Correct the вещевой пропуск rule: amendment №2 changes 3.19.2, and the pass is returned, not seized.
          s = s.replace("id:'tmc-thing-pass', title:'Внос / вынос ТМЦ по вещевому (разовому материальному) пропуску', priority:10,",
                        "id:'tmc-thing-pass', title:'Внос / вынос инструмента и оборудования по вещевому пропуску', priority:10,")
          s = s.replace("refs:['п. 3.19.1'], amended:['Изм. №2: п. 3.19.1'],",
                        "refs:['п. 3.19.2'], amended:['Изм. №2, п. 11 — новая редакция п. 3.19.2'],")
          s = s.replace("verdict:'Сверить фактически перемещаемые ТМЦ с вещевым пропуском, сделать обязательную запись и изъять пропуск после перемещения.'",
                        "verdict:'Сверить фактически перемещаемые ТМЦ с вещевым пропуском, сделать обязательную запись в журнале и после внесения записи вернуть вещевой пропуск работнику (группе, бригаде).'" )
          s = s.replace("'После перемещения ТМЦ вещевой пропуск изъять.'",
                        "'После внесения записи вещевой пропуск вернуть работнику (группе, бригаде).'" )
          s = s.replace("note:'П. 3.19.1 изложен в новой редакции Изменением №2: обязательна сверка, запись в журнале и изъятие вещевого пропуска.'",
                        "note:'Изменение №2, п. 11 изложило п. 3.19.2 в новой редакции: работник охраны сверяет ТМЦ с данными вещевого пропуска, делает запись в журнале, после чего вещевой пропуск возвращается работнику (группе, бригаде).'" )

          # Give the new rule a strong semantic boost for natural-language refusal phrases.
          score_marker = """    if(rule.id==='vehicle-ngkm' && /(автобус|экскаватор|машин|автомобил|грузовик|самосвал|спецтехник)/.test(n)) score += 6;"""
          score_new = """    if(rule.id==='document-refusal' && /(документ|пропуск|удостоверен)/.test(n) && /(отказ|не хочет|не дает|не даёт|не показывает|не предъяв|не переда|предостав)/.test(n)) score += 18;\n""" + score_marker
          if "rule.id==='document-refusal'" not in s[s.find('function scoreRule'):s.find('function analyze')]:
              if score_marker not in s: raise SystemExit('score marker not found')
              s = s.replace(score_marker, score_new, 1)

          # Add visible version marker for cache/debugging.
          if 'ИоПиВОР v2' not in s:
              s = s.replace('Инструкция 2018 · учтены Изменения №2 (2022) и №3 (2023)',
                            'ИоПиВОР v2 · Инструкция 2018 · учтены Изменения №2 (2022) и №3 (2023)', 1)

          p.write_text(s, encoding='utf-8')
          print('patched', p, 'bytes', len(s.encode('utf-8')))
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- iopivor/index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iopivor/index.html
          git commit -m "Improve ИоПиВОР document refusal and source accuracy"
          git push
