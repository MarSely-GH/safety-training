name: Simplify ИоПиВОР

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-iopivor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild simple ИоПиВОР
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('iopivor/index.html')
          old = p.read_text(encoding='utf-8')

          marker = 'const RULES = ['
          pos = old.find(marker)
          if pos < 0:
              raise SystemExit('RULES array not found')
          start = old.find('[', pos)
          depth = 0
          quote = None
          esc = False
          end = None
          for i in range(start, len(old)):
              ch = old[i]
              if quote:
                  if esc:
                      esc = False
                  elif ch == '\\':
                      esc = True
                  elif ch == quote:
                      quote = None
                  continue
              if ch in "'\"`":
                  quote = ch
                  continue
              if ch == '[':
                  depth += 1
              elif ch == ']':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('RULES array end not found')
          rules = old[start:end]

          html = r'''<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<meta name="application-name" content="ИоПиВОР">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ИоПиВОР">
<meta name="description" content="ИоПиВОР — поиск по Инструкции о пропускном и внутриобъектовом режимах">
<meta name="app-version" content="iopivor-simple-v3">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>ИоПиВОР</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#182230;--muted:#667085;--line:#d0d5dd;--blue:#1769e0;--green:#05603a;--greenbg:#eafbf2;--soft:#f8fafc;--warn:#8a5700;--warnbg:#fff7e6}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px 12px 60px}.top{position:sticky;top:0;z-index:10;background:rgba(244,246,248,.98);backdrop-filter:blur(8px);padding:8px 0 12px}h1{font-size:28px;margin:0 0 5px}.sub{color:var(--muted);font-size:14px;margin:0 0 14px}.searchrow{display:flex;gap:8px}.search{flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;background:#fff;padding:15px;font-size:18px;outline:none}.search:focus{border-color:var(--blue)}.mic{width:64px;flex:0 0 64px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:28px;cursor:pointer}.mic.on{background:var(--blue);border-color:var(--blue);color:#fff}.hint{min-height:19px;margin:6px 2px 0;color:var(--muted);font-size:13px}.infoBtn{margin-top:7px;border:0;background:transparent;color:var(--blue);font-weight:700;font-size:14px;padding:5px 2px;cursor:pointer}.info{margin-top:5px;background:#fff;border:1px solid #e3e7ee;border-radius:13px;padding:11px 12px;color:#475467;font-size:13px;line-height:1.5}.results{margin-top:4px}.card{background:var(--card);border:1px solid #e3e7ee;border-radius:17px;padding:15px;margin:11px 0;box-shadow:0 2px 9px rgba(16,24,40,.04)}.card.best{border:2px solid #b8ccff}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.ref{background:#eef4ff;color:#175cd3;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}.amend{background:#fff7e6;color:#8a5700}.title{font-size:18px;line-height:1.35;font-weight:800}.answer{margin-top:11px;background:var(--greenbg);color:var(--green);border-radius:12px;padding:12px 13px;font-size:16px;line-height:1.45;font-weight:700}.label{display:block;font-size:11px;font-weight:900;letter-spacing:.04em;margin-bottom:5px}.block{margin-top:11px;background:var(--soft);border:1px solid #eaecf0;border-radius:12px;padding:11px 12px;font-size:14px;line-height:1.48}.block ul,.block ol{margin:5px 0 0;padding-left:20px}.block li{margin:6px 0}.source{margin-top:9px;color:var(--muted);font-size:12px;line-height:1.45}.notfound{background:#fff;border:1px solid #e3e7ee;border-radius:16px;padding:18px;margin-top:12px;color:#475467;line-height:1.5}.secondaryTitle{font-size:13px;color:var(--muted);font-weight:800;margin:18px 2px 4px}.hidden{display:none!important}@media(max-width:560px){h1{font-size:25px}.search{font-size:16px}.title{font-size:17px}.answer{font-size:15px}}
</style>
</head>
<body>
<main class="wrap">
<section class="top">
<h1>ИоПиВОР</h1>
<p class="sub">Поиск по Инструкции о пропускном и внутриобъектовом режимах</p>
<div class="searchrow">
<input id="q" class="search" type="search" placeholder="Опишите или скажите ситуацию…" autocomplete="off" autofocus>
<button id="mic" class="mic" type="button" aria-label="Голосовой ввод" title="Голосовой ввод">🎤</button>
</div>
<div id="hint" class="hint"></div>
<button id="infoBtn" class="infoBtn" type="button">Инструкция</button>
<div id="info" class="info hidden">Введите или скажите ситуацию обычными словами. Ниже появятся найденные требования: что говорит Инструкция, что делать и на какие пункты ссылаться. Поиск основан только на Инструкции 2018 года и присланных Изменениях №2 и №3. Если точного основания нет, приложение сообщит об этом.</div>
</section>
<section id="results" class="results"></section>
</main>
<script>
const RULES = __RULES__;
(()=>{
const q=document.getElementById('q'),mic=document.getElementById('mic'),hint=document.getElementById('hint'),results=document.getElementById('results'),infoBtn=document.getElementById('infoBtn'),info=document.getElementById('info');
infoBtn.addEventListener('click',()=>info.classList.toggle('hidden'));
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[«»“”„"'()\[\]{}:;,.!?/\\\-]+/g,' ').replace(/\s+/g,' ').trim();
const stop=new Set('и или а но что как какой какая какое какие кто где когда для при на в во по из от до с со у о об про за над под между это этот эта эти если ли не мне нам ему ей их мой моя свои свое своего нужно надо можно нельзя должен должна должны делать сделать произошло происходит ситуация вопрос'.split(' '));
const words=s=>norm(s).split(' ').filter(w=>w.length>2&&!stop.has(w));
const pref=w=>w.length>5?w.slice(0,5):w;
function scoreRule(r,text){
 const n=norm(text), ws=words(text), hay=norm([r.title,r.verdict,r.note,(r.steps||[]).join(' '),(r.docs||[]).join(' '),(r.refs||[]).join(' '),(r.keywords||[]).join(' '),(r.phrases||[]).join(' ')].join(' '));
 let score=r.priority||0;
 (r.phrases||[]).forEach(p=>{if(n.includes(norm(p)))score+=18});
 (r.keywords||[]).forEach(k=>{const nk=norm(k);if(n.includes(nk))score+=nk.includes(' ')?9:5});
 let matched=0; for(const w of ws){const p=pref(w); if(hay.includes(w)||hay.split(' ').some(x=>x.startsWith(p)))matched++;}
 if(ws.length)score+=matched*4+(matched===ws.length?8:0);
 if(r.id==='document-refusal'&&/(документ|пропуск|удостоверен)/.test(n)&&/(отказ|не хочет|не дает|не даёт|не показывает|не предъяв|не переда|предостав)/.test(n))score+=22;
 if(r.id==='wrong-pass'&&/(чуж|не свой|другого).*пропуск/.test(n))score+=14;
 if(r.id==='fire-emergency'&&/(авари|пожар|взрыв|мчс|скорая|спасат)/.test(n))score+=10;
 if(r.id==='foreign'&&/(иностран|без гражданства)/.test(n))score+=12;
 if(r.id==='drone'&&/(дрон|бвс|беспилот|квадрокоптер)/.test(n))score+=16;
 return {score,matched,total:ws.length};
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderRule(r,best=false){
 const refs=[...(r.refs||[]),...(r.amended||[])];
 return `<article class="card ${best?'best':''}"><div class="meta">${refs.map((x,i)=>`<span class="ref ${i>=(r.refs||[]).length?'amend':''}">${esc(x)}</span>`).join('')}</div><div class="title">${esc(r.title)}</div><div class="answer"><span class="label">ЧТО ГОВОРИТ ИНСТРУКЦИЯ</span>${esc(r.verdict||r.action||'')}</div>${r.steps&&r.steps.length?`<div class="block"><span class="label">ЧТО ДЕЛАТЬ</span><ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}${r.docs&&r.docs.length?`<div class="block"><span class="label">ЧТО ПРОВЕРИТЬ</span><ul>${r.docs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${r.note?`<div class="source"><b>Основание:</b> ${esc(r.note)}</div>`:''}</article>`;
}
function analyze(){
 const text=q.value.trim(); if(!text){results.innerHTML='';hint.textContent='';return;}
 const ranked=RULES.map(r=>({r,...scoreRule(r,text)})).sort((a,b)=>b.score-a.score); const best=ranked[0];
 if(!best||best.score<12){results.innerHTML='<div class="notfound"><b>Точного пункта не найдено.</b><br>Уточните, кто прибыл, куда, какие документы есть и что именно человек отказывается делать.</div>';return;}
 const selected=ranked.filter((x,i)=>i===0||(x.score>=best.score-9&&x.matched>0)).slice(0,3);
 results.innerHTML=renderRule(selected[0].r,true)+(selected.length>1?'<div class="secondaryTitle">Также может относиться к ситуации</div>'+selected.slice(1).map(x=>renderRule(x.r,false)).join(''):'');
}
let timer; q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(analyze,350)}); q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);analyze();}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null,listening=false;
if(SR){rec=new SR();rec.lang='ru-RU';rec.interimResults=true;rec.continuous=false;let finalText='';
 rec.onstart=()=>{listening=true;finalText='';mic.classList.add('on');hint.textContent='Слушаю…';};
 rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+' ';else interim+=t;}q.value=(finalText+interim).trim();};
 rec.onerror=e=>{hint.textContent=e.error==='not-allowed'?'Нет разрешения на микрофон':'Не удалось распознать речь';};
 rec.onend=()=>{listening=false;mic.classList.remove('on');if(q.value.trim()){hint.textContent='';analyze();}else hint.textContent='';};
 mic.addEventListener('click',()=>{try{listening?rec.stop():rec.start()}catch(_){}});
}else{mic.disabled=true;hint.textContent='Голосовой ввод не поддерживается этим браузером';}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>'''.replace('__RULES__', rules)
          p.write_text(html, encoding='utf-8')

          sw = """const CACHE='iopivor-simple-v3';\nself.addEventListener('install',e=>{self.skipWaiting();});\nself.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});\nself.addEventListener('fetch',e=>{if(e.request.method!=='GET')return; if(e.request.mode==='navigate'){e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(CACHE).then(x=>x.put('./index.html',c));return r;}).catch(()=>caches.match('./index.html')));return;} e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{const cp=r.clone();caches.open(CACHE).then(x=>x.put(e.request,cp));return r;})));});\n"""
          Path('iopivor/sw.js').write_text(sw, encoding='utf-8')
          print('rebuilt simple ИоПиВОР', len(html.encode('utf-8')), 'bytes')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- iopivor/index.html iopivor/sw.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iopivor/index.html iopivor/sw.js
          git commit -m "Simplify ИоПиВОР search interface"
          git push
