<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155eef"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../ohrana/icon-192.png"><title>Охрана труда — быстрый поиск</title><style>:root{--b:#f4f6f8;--c:#fff;--t:#111827;--m:#667085;--p:#155eef;--g:#067647;--gb:#ecfdf3;--bd:#d0d5dd;--warn:#b54708;--wb:#fffaeb}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:14px 12px 60px}.top{position:sticky;top:0;z-index:5;background:rgba(244,246,248,.97);backdrop-filter:blur(9px);padding:8px 0 12px}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--m);font-size:14px;margin:0 0 12px}.search input{width:100%;font-size:18px;padding:14px;border:2px solid var(--bd);border-radius:14px;outline:0;background:#fff}.search input:focus{border-color:var(--p)}select,button{font:inherit}select{border:1px solid var(--bd);border-radius:12px;background:#fff;padding:10px 12px}.filters{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.count{color:var(--m);font-size:13px}.card{background:var(--c);border:1px solid #eaecf0;border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 2px 10px rgba(16,24,40,.04)}.meta{font-size:13px;color:var(--p);font-weight:800;margin-bottom:7px}.q{font-size:18px;font-weight:750;line-height:1.36}.ans{margin-top:11px;padding:12px;border-radius:12px;background:var(--gb);color:#054f31;font-size:17px;font-weight:800}.ans small{display:block;font-size:12px;color:var(--g);font-weight:800;margin-bottom:4px}.warn{margin-top:9px;padding:9px 10px;border-radius:10px;background:var(--wb);color:var(--warn);font-size:13px}.empty{text-align:center;color:var(--m);padding:48px 10px}.install{display:none;background:var(--p);color:#fff;border:0;border-radius:11px;padding:10px 13px;font-weight:800}.loading{text-align:center;color:var(--m);padding:48px 10px}@media(max-width:540px){h1{font-size:22px}.q{font-size:17px}.ans{font-size:16px}.search input{font-size:17px}}</style></head><body><div class="wrap"><div class="top"><h1>Охрана труда</h1><p class="sub">Быстрый поиск правильного ответа по билетам 2024</p><div class="search"><input id="s" type="search" placeholder="Введите часть вопроса…" autocomplete="off" autofocus></div><div class="filters"><select id="ticket"><option value="">Все билеты</option></select><span class="count" id="count"></span><button id="install" class="install">Установить приложение</button></div></div><div id="list" class="loading">Загружаю 465 вопросов…</div></div><iframe id="dbframe" src="../ohrana-v2/data.js?v=iframe2" style="position:absolute;width:1px;height:1px;left:-9999px;border:0"></iframe><script>let DATA=[];const $=s=>document.querySelector(s),inp=$('#s'),ticket=$('#ticket'),list=$('#list'),count=$('#count');const norm=s=>(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/gi,' ').trim();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function decodeBase64(raw){let b64=(raw||'').replace(/[^A-Za-z0-9+/=]/g,'');if(!b64.startsWith('H4sI'))throw Error('получен неверный файл базы');while(b64.length%4)b64+='=';let bin;try{bin=atob(b64)}catch(e){throw Error('ошибка base64, длина '+b64.length)}const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw Error('обновите браузер');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));DATA=JSON.parse(await new Response(stream).text());if(!Array.isArray(DATA)||DATA.length!==465)throw Error('загружено '+(DATA?.length||0)+' вопросов вместо 465');init()}function fail(e){list.className='empty';list.innerHTML='<b>База не загрузилась.</b><br><br>'+esc(e.message||e)+'<br><br>Пришлите этот текст ошибки.'}const frame=$('#dbframe');frame.onload=()=>{try{const d=frame.contentDocument;const raw=(d&&d.body&&(d.body.innerText||d.body.textContent))||'';decodeBase64(raw).catch(fail)}catch(e){fail(e)}};frame.onerror=()=>fail(new Error('не удалось открыть файл базы'));function init(){list.className='';for(let n=1;n<=31;n++)ticket.insertAdjacentHTML('beforeend','<option value="'+n+'">Билет '+n+'</option>');render()}function score(o,terms){const hay=norm(o.x+' '+o.y);let z=0;for(const t of terms){if(!hay.includes(t))return-1;z+=t.length+5;if(norm(o.x).includes(t))z+=8}return z}function render(){if(!DATA.length)return;const terms=norm(inp.value).split(/\s+/).filter(Boolean),tv=ticket.value;let a=DATA.filter(o=>!tv||String(o.t)===tv);if(terms.length)a=a.map(o=>[o,score(o,terms)]).filter(v=>v[1]>=0).sort((a,b)=>b[1]-a[1]).map(v=>v[0]);else a=a.slice(0,35);count.textContent=terms.length||tv?'Найдено: '+a.length:'Всего: '+DATA.length+' вопросов';if(!a.length){list.innerHTML='<div class="empty">Ничего не найдено. Попробуйте 1–3 ключевых слова.</div>';return}list.innerHTML=a.slice(0,80).map(o=>'<article class="card"><div class="meta">Билет '+o.t+' · вопрос '+o.q+'</div><div class="q">'+esc(o.x)+'</div><div class="ans"><small>ПРАВИЛЬНЫЙ ОТВЕТ: '+o.a+'</small>'+esc(o.y||('В ключе указан вариант №'+o.a+', но текста варианта в билете нет.'))+'</div>'+(o.w?'<div class="warn">⚠ '+esc(o.w)+'</div>':'')+'</article>').join('')}let tm;inp.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(render,60)});ticket.addEventListener('change',render);let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').style.display='inline-block'});$('#install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#install').style.display='none'};</script></body></html>
