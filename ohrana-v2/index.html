<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155eef"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../ohrana/icon-192.png"><title>Охрана труда — быстрый поиск</title><style>:root{--b:#f4f6f8;--c:#fff;--t:#111827;--m:#667085;--p:#155eef;--g:#067647;--gb:#ecfdf3;--bd:#d0d5dd;--warn:#b54708;--wb:#fffaeb}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:16px 14px 60px}.top{position:sticky;top:0;z-index:5;background:rgba(244,246,248,.97);backdrop-filter:blur(9px);padding:8px 0 12px}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--m);font-size:14px;margin:0 0 12px}.search input{width:100%;font-size:18px;padding:14px;border:2px solid var(--bd);border-radius:14px;outline:0;background:#fff}.search input:focus{border-color:var(--p)}select,button{font:inherit}select{border:1px solid var(--bd);border-radius:12px;background:#fff;padding:10px}.filters{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.count{color:var(--m);font-size:13px}.card{background:var(--c);border:1px solid #eaecf0;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(16,24,40,.04)}.meta{font-size:13px;color:var(--p);font-weight:700;margin-bottom:8px}.q{font-size:18px;font-weight:700;line-height:1.35}.ans{margin-top:12px;padding:12px;border-radius:12px;background:var(--gb);color:#054f31;font-size:17px;font-weight:800}.ans small{display:block;font-size:12px;color:var(--g);font-weight:700;margin-bottom:4px}.warn{margin-top:9px;padding:9px 10px;border-radius:10px;background:var(--wb);color:var(--warn);font-size:13px}.empty{text-align:center;color:var(--m);padding:50px 10px}.install{display:none;margin:8px 0 0;background:var(--p);color:#fff;border:0;border-radius:11px;padding:10px 13px;font-weight:700}.loading{padding:50px;text-align:center;color:var(--m)}@media(max-width:540px){h1{font-size:21px}.q{font-size:17px}.ans{font-size:16px}.search input{font-size:16px}.wrap{padding-left:10px;padding-right:10px}}</style></head><body><div class="wrap"><div class="top"><h1>Охрана труда</h1><p class="sub">Быстрый поиск правильного ответа по билетам 2024</p><div class="search"><input id="s" type="search" placeholder="Введите часть вопроса…" autocomplete="off" autofocus></div><div class="filters"><select id="ticket"><option value="">Все билеты</option></select><span class="count" id="count"></span><button id="install" class="install">Установить приложение</button></div></div><div id="list" class="loading">Загружаю 465 вопросов…</div></div><script>let DATA=[];const $=s=>document.querySelector(s),inp=$('#s'),ticket=$('#ticket'),list=$('#list'),count=$('#count');const norm=s=>(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/gi,' ').trim();async function load(){try{const r=await fetch('./data.js?v=8',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let b64=await r.text();b64=b64.replace(/[^A-Za-z0-9+/=]/g,'');if(!b64.startsWith('H4sI'))throw Error('Сервер вернул не базу данных');while(b64.length%4)b64+='=';const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw Error('Нужна свежая версия браузера');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));DATA=JSON.parse(await new Response(stream).text());if(!Array.isArray(DATA)||DATA.length!==465)throw Error('Загружено вопросов: '+(DATA?.length||0));init()}catch(e){list.innerHTML='<div class="empty"><b>База пока не загрузилась.</b><br><small>'+esc(e.message)+'</small><br><br>Пришлите этот текст ошибки.</div>'}}function init(){[...new Set(DATA.map(x=>x.t))].sort((a,b)=>a-b).forEach(n=>ticket.insertAdjacentHTML('beforeend',`<option value="${n}">Билет ${n}</option>`));render()}function score(q,terms){const hay=norm(q.x+' '+q.y);let s=0;for(const t of terms){if(hay.includes(t))s+=t.length+5;else return-1}if(norm(q.x).includes(terms.join(' ')))s+=40;return s}function render(){const terms=norm(inp.value).split(' ').filter(Boolean),t=ticket.value;let arr=DATA.filter(q=>(!t||String(q.t)===t));if(terms.length)arr=arr.map(q=>[q,score(q,terms)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);else arr=arr.slice(0,45);count.textContent=terms.length||t?`Найдено: ${arr.length}`:`Всего: ${DATA.length}. Введите запрос`;if(!arr.length){list.innerHTML='<div class="empty">Ничего не найдено. Попробуйте 2–3 ключевых слова.</div>';return}list.className='';list.innerHTML=arr.slice(0,80).map(q=>`<article class="card"><div class="meta">Билет ${q.t} · вопрос ${q.q}</div><div class="q">${esc(q.x)}</div><div class="ans"><small>ПРАВИЛЬНЫЙ ОТВЕТ: ${q.a}</small>${esc(q.y)}</div>${q.w?`<div class="warn">${esc(q.w)}</div>`:''}</article>`).join('')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let timer;inp.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,70)});ticket.addEventListener('change',render);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=8'));let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').style.display='inline-block'});$('#install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#install').style.display='none'};load();</script></body></html>
