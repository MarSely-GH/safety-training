<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#246bfd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Вахта — зарплата</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f4f6f8;color:#18212b}.loader{max-width:720px;margin:50px auto;padding:24px}.box{background:#fff;border:1px solid #dfe5eb;border-radius:18px;padding:22px}.muted{color:#66717f}</style>
</head>
<body>
<div class="loader"><div class="box"><h2>Вахта — зарплата</h2><p class="muted">Загружаю калькулятор…</p></div></div>
<script>
(async()=>{
  const base='https://raw.githubusercontent.com/MarSely-GH/my-first-project/main/';
  try{
    const bust='?v='+Date.now();
    const [htmlText,css,core]=await Promise.all([
      fetch(base+'index.html'+bust,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('index '+r.status);return r.text()}),
      fetch(base+'styles.css'+bust,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('styles '+r.status);return r.text()}),
      fetch(base+'core.js'+bust,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('core '+r.status);return r.text()})
    ]);
    const parsed=new DOMParser().parseFromString(htmlText,'text/html');
    document.title=parsed.title||'Вахта — зарплата';
    const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
    document.body.innerHTML=parsed.body.innerHTML;
    (0,eval)(core);
  }catch(e){
    document.body.innerHTML='<div class="loader"><div class="box"><h2>Не удалось загрузить калькулятор</h2><p class="muted">Обновите страницу.</p><p class="muted" style="font-size:12px">'+String(e.message||e)+'</p></div></div>';
  }
})();
</script>
</body>
</html>
