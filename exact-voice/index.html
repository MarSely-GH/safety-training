<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155eef"><title>Охрана труда — голосовой поиск</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="../exact/?voicefix=2" title="Охрана труда — быстрый поиск"></iframe><script>(()=>{const frame=document.getElementById('app');frame.addEventListener('load',()=>{let w,d;try{w=frame.contentWindow;d=w.document}catch(e){return}const old=d.getElementById('voice');const input=d.getElementById('s')||d.getElementById('q');if(!old||!input)return;const btn=old.cloneNode(true);old.replaceWith(btn);let hint=d.getElementById('voicehint');if(!hint){hint=d.createElement('div');hint.id='voicehint';hint.style.cssText='font-size:12px;color:#667085;margin-top:6px';btn.parentElement.parentElement.appendChild(hint)}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const show=m=>{hint.textContent=m;if(hint.classList)hint.classList.add('show')};const reset=()=>{btn.classList.remove('listening');btn.textContent='🎤'};if(!SR){btn.onclick=()=>show('Голосовой поиск не поддерживается этим браузером. Откройте в Chrome.');return}const rec=new SR();rec.lang='ru-RU';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=1;rec.onstart=()=>{btn.classList.add('listening');btn.textContent='●';show('Говорите…')};rec.onresult=e=>{const t=(e.results&&e.results[0]&&e.results[0][0]&&e.results[0][0].transcript||'').trim();if(!t)return;input.value=t;try{input.dispatchEvent(new w.Event('input',{bubbles:true}))}catch(_){}try{if(typeof w.render==='function')w.render()}catch(_){}setTimeout(()=>{try{if(typeof w.render==='function')w.render()}catch(_){}},100);input.focus();show('Распознано: «'+t+'»')};rec.onerror=e=>{let m='Не удалось распознать речь.';if(e.error==='not-allowed'||e.error==='service-not-allowed')m='Разрешите браузеру доступ к микрофону.';else if(e.error==='audio-capture')m='Микрофон недоступен.';else if(e.error==='no-speech')m='Речь не услышана. Нажмите микрофон и попробуйте ещё раз.';show(m);reset()};rec.onend=reset;btn.addEventListener('click',ev=>{ev.preventDefault();try{rec.start()}catch(_){}})})})();</script></body></html>
